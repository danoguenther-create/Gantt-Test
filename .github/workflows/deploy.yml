name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/gantt-project-planner-5i3Gy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build Pages bundle
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Build portable single-file bundle
        run: npm run build:single

      - name: Embed portable HTML into Pages output
        run: cp dist-single/index.html dist/portable.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload portable HTML as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gantt-planner-portable
          path: dist-single/index.html

      - id: deploy
        uses: actions/deploy-pages@v4
